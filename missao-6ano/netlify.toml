# Site estático: sem build. Publica a própria pasta.
[build]
  publish = "."

# O service worker e o HTML nunca podem ficar presos em cache, senão as atualizações demoram a chegar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
